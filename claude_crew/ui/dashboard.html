<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>claude-crew · Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-0: oklch(0.91 0.016 236);
      --bg-1: oklch(0.83 0.026 237);
      --bg-2: oklch(0.74 0.034 238);
      --bg-3: oklch(0.64 0.042 239);
      --bg-4: oklch(0.54 0.050 240);
      --line: oklch(0.60 0.044 239);
      --line-soft: oklch(0.72 0.032 238);
      --fg-0: oklch(0.13 0.068 262);
      --fg-1: oklch(0.22 0.074 260);
      --fg-2: oklch(0.40 0.055 257);
      --fg-3: oklch(0.55 0.040 253);
      --accent: oklch(0.55 0.210 240);
      --accent-soft: oklch(0.55 0.210 240 / 0.14);
      --accent-line: oklch(0.55 0.210 240 / 0.45);

      --st-idle:     oklch(0.50 0.038 257);
      --st-thinking: oklch(0.62 0.15 75);
      --st-tool:     oklch(0.55 0.16 290);
      --st-waiting:  oklch(0.55 0.16 240);
      --st-done:     oklch(0.57 0.15 150);
      --st-error:    oklch(0.53 0.18 25);

      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'Geist Mono', 'Fira Code', monospace;
    }

    html, body, #root {
      height: 100%;
      background: var(--bg-0);
      color: var(--fg-0);
      font-family: var(--font-sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    #root { display: flex; flex-direction: column; overflow: hidden; }

    .mono { font-family: var(--font-mono); }

    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      height: 20px; padding: 0 7px; border-radius: 10px;
      background: var(--bg-2); border: 1px solid var(--line);
      font-size: 10.5px; color: var(--fg-2);
    }

    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.idle        { background: var(--st-idle); }
    .dot.thinking    { background: var(--st-thinking); animation: pulse 1.6s ease-in-out infinite; }
    .dot.tool-use    { background: var(--st-tool);     animation: pulse 1.6s ease-in-out infinite; }
    .dot.waiting     { background: var(--st-waiting); }
    .dot.active      { background: var(--st-done); }
    .dot.done        { background: var(--st-done); }
    .dot.error       { background: var(--st-error); }
    .dot.unreachable { background: var(--st-error); opacity: 0.5; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* F22 D-1: column-top accent bar for cross-column scan signal (SC-1).
       3px high, full width. Tool-color tinted when in-flight. <5s: muted
       (active class, opacity 0.5). >=5s: full opacity + pulse (stuck class,
       reuses the existing pulse keyframe so column reads as one organism). */
    .agent-column-accent {
      height: 3px;
      flex-shrink: 0;
      background: transparent;
      transition: background 0.2s ease, opacity 0.2s ease;
    }
    .agent-column-accent.active {
      background: var(--st-tool);
      opacity: 0.5;
    }
    .agent-column-accent.stuck {
      background: var(--st-tool);
      opacity: 1;
      animation: pulse 1.6s ease-in-out infinite;
    }

    /* F22 D-2/D-10: dedicated tool-chip row (always reserved 22px regardless
       of in-flight state — prevents layout strobing on rapid Pre/Post pairs). */
    .tool-chip-row {
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--bg-0);
      overflow: hidden;
    }
    .tool-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 18px;
      padding: 0 8px;
      border-radius: 4px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-1);
      max-width: 100%;
      min-width: 0;
    }
    .tool-chip .tool-name {
      color: var(--st-tool);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .tool-chip .tool-elapsed {
      color: var(--fg-2);
      flex-shrink: 0;
    }
    .tool-chip .tool-count {
      color: var(--fg-3);
      flex-shrink: 0;
    }
    /* F22 D-6: pulse threshold at displayed elapsed >=5s. Reuses pulse keyframe. */
    .tool-chip.stuck .tool-elapsed {
      animation: pulse 1.6s ease-in-out infinite;
    }
    .tool-chip.settled {
      background: var(--bg-1);
      opacity: 0.85;
    }

    /* ui-agent-transparency: dead-teammate row dimming */
    .tm-row-dead {
      opacity: 0.45;
      filter: grayscale(0.35);
      pointer-events: auto; /* keep chips/panel clickable */
    }

    /* ui-agent-transparency: config chips strip */
    .tm-config-chips {
      display: flex; gap: 5px; padding: 4px 14px;
      flex-wrap: wrap; align-items: center;
      border-bottom: 1px solid var(--line-soft);
      background: var(--bg-0);
      flex-shrink: 0; min-height: 26px; cursor: pointer;
    }
    .tm-config-chip {
      display: inline-flex; align-items: center;
      height: 18px; padding: 0 7px; border-radius: 9px;
      background: var(--bg-2); border: 1px solid var(--line);
      font-size: 10px; color: var(--fg-2);
      white-space: nowrap;
    }
    /* lead-extends-teammate-tools-and-skills: visually distinct extras chip */
    .tm-config-chip-extra {
      background: oklch(0.62 0.15 75 / 0.12);
      border-color: oklch(0.62 0.15 75 / 0.40);
      color: oklch(0.40 0.12 75);
    }
    /* detail panel backdrop + panel */
    .tm-detail-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      background: oklch(0.10 0.01 240 / 0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .tm-detail-panel {
      background: var(--bg-1); border: 1px solid var(--line);
      border-radius: 8px; padding: 22px 24px;
      width: min(640px, 90vw); max-height: 85vh;
      overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 8px 32px oklch(0.10 0.01 240 / 0.30);
    }
    .tm-detail-section { display: flex; flex-direction: column; gap: 4px; }
    .tm-detail-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--fg-3);
    }
    .tm-detail-value { font-size: 12px; color: var(--fg-0); }
    .tm-detail-prompt {
      font-family: var(--font-mono); font-size: 11px; color: var(--fg-1);
      background: var(--bg-2); border: 1px solid var(--line);
      border-radius: 4px; padding: 8px 10px;
      max-height: 60vh; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
      margin: 0;
    }
    .tm-detail-list {
      display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0;
      list-style: none;
    }
    .tm-detail-list-item {
      display: inline-flex; align-items: center;
      height: 20px; padding: 0 8px; border-radius: 4px;
      background: var(--bg-2); border: 1px solid var(--line);
      font-family: var(--font-mono); font-size: 11px; color: var(--fg-1);
    }

    /* dead-teammate-ui-segregation */
    .terminated-section { border-top: 1px solid var(--line); margin-top: 8px; flex-shrink: 0; }
    .terminated-header {
      width: 100%; text-align: left; background: none; border: none;
      cursor: pointer; padding: 6px 12px;
      color: var(--fg-3); font-size: 11px;
      letter-spacing: 0.05em; text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-sans);
    }
    .terminated-header:hover { color: var(--fg-1); }
    .terminated-list { padding: 4px 0; }
    .terminated-row {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 12px; cursor: pointer; opacity: 0.6;
    }
    .terminated-row:hover { opacity: 0.9; background: var(--bg-1); }

    /* startup-diagnostics-dashboard: reuses terminated-section visual idiom */
    .startup-notices-section { border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--bg-1); }
    .startup-notices-header {
      width: 100%; text-align: left; background: none; border: none;
      cursor: pointer; padding: 6px 12px;
      color: var(--fg-2); font-size: 11px;
      letter-spacing: 0.05em; text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-sans);
    }
    .startup-notices-header:hover { color: var(--fg-1); }
    .startup-notices-list { padding: 4px 0; }
    .startup-notice-row {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 12px;
      font-family: var(--font-mono); font-size: 11px; color: var(--fg-1);
    }
    .startup-notice-row.startup-notice-info { opacity: 0.7; }
    .ctx-window-bar {
      display: inline-flex; align-items: center; gap: 6px;
      margin-left: auto; font-size: 10.5px; color: var(--fg-3);
      font-family: var(--font-mono); cursor: default;
    }
    .ctx-window-bar-track {
      display: inline-block;
      width: 64px; height: 5px; border-radius: 3px;
      background: var(--bg-2); overflow: hidden;
    }
    .ctx-window-bar-fill {
      display: block;
      height: 100%; transition: width 0.25s ease, background-color 0.25s ease;
    }
    .ctx-window-bar-fill.ctx-ok      { background: oklch(0.62 0.15 145); }
    .ctx-window-bar-fill.ctx-warn    { background: oklch(0.65 0.18 75); }
    .ctx-window-bar-fill.ctx-danger  { background: oklch(0.55 0.20 25); }
    .startup-notice-badge {
      display: inline-block;
      padding: 0 6px; border-radius: 3px;
      font-family: var(--font-sans); font-weight: 600; font-size: 10px;
      letter-spacing: 0.05em;
      flex-shrink: 0; min-width: 44px; text-align: center;
    }
    .startup-notice-badge-info {
      background: var(--bg-2); color: var(--fg-2);
    }
    .startup-notice-badge-warning {
      background: oklch(0.62 0.15 75 / 0.20); color: oklch(0.40 0.15 75);
    }
    .startup-notice-badge-error {
      background: oklch(0.53 0.18 25 / 0.20); color: oklch(0.40 0.18 25);
    }
    .startup-notice-source {
      color: var(--fg-3); flex-shrink: 0;
    }
    .startup-notice-category {
      color: var(--fg-3); flex-shrink: 0;
    }
    .startup-notice-message {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .startup-notice-message:hover { white-space: normal; word-break: break-word; }
    .startup-notices-toggle {
      margin-left: auto; background: none; border: 1px solid var(--line);
      cursor: pointer; padding: 2px 8px; border-radius: 3px;
      font-family: var(--font-sans); font-size: 10px; color: var(--fg-2);
      text-transform: none; letter-spacing: 0;
    }
    .startup-notices-toggle:hover { color: var(--fg-1); background: var(--bg-2); }

    /* roster-spotlight: left-rail roster row.
       Two-line layout, leading vertical accent bar (3px), click toggles
       spotlight inclusion. Selected: brighter bg. Unselected: dim. */
    .roster-section {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex; flex-direction: column;
      background: var(--bg-0);
    }
    .roster-section-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      font-size: 11px; color: var(--fg-3);
      letter-spacing: 0.05em; text-transform: uppercase;
      border-bottom: 1px solid var(--line-soft);
      background: var(--bg-1);
      flex-shrink: 0;
      position: sticky; top: 0; z-index: 1;
    }
    .roster-section-header-count {
      color: var(--fg-2);
    }
    .roster-section-action {
      margin-left: auto; background: none; border: 1px solid var(--line);
      cursor: pointer; padding: 2px 8px; border-radius: 3px;
      font-family: var(--font-sans); font-size: 10px; color: var(--fg-2);
      text-transform: none; letter-spacing: 0;
    }
    .roster-section-action:hover { color: var(--fg-1); background: var(--bg-2); }
    .roster-section-action:disabled { cursor: default; opacity: 0.4; }

    .roster-empty {
      padding: 16px 14px; font-size: 11px; color: var(--fg-3);
      text-align: center;
    }

    .roster-row {
      position: relative;
      display: grid;
      grid-template-columns: 22px 1fr auto;
      grid-template-rows: auto auto;
      column-gap: 8px; row-gap: 2px;
      padding: 7px 12px 7px 16px;
      border-bottom: 1px solid var(--line-soft);
      cursor: pointer;
      transition: background 0.12s ease, opacity 0.12s ease;
      background: transparent;
    }
    .roster-row::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: transparent;
      transition: background 0.2s ease, opacity 0.2s ease;
    }
    .roster-row.tool-active::before { background: var(--st-tool); opacity: 0.5; }
    .roster-row.tool-stuck::before  { background: var(--st-tool); opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
    .roster-row:hover { background: var(--bg-1); }
    .roster-row.selected { background: var(--accent-soft); }
    .roster-row.selected:hover { background: var(--accent-soft); filter: brightness(1.04); }
    .roster-row.unselected { opacity: 0.55; }
    .roster-row.unselected:hover { opacity: 0.85; }

    .roster-row-avatar { grid-row: 1 / span 2; align-self: center; }
    .roster-row-identity {
      grid-column: 2; grid-row: 1;
      display: flex; align-items: center; gap: 6px;
      min-width: 0;
    }
    .roster-row-name {
      font-size: 12.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .roster-row-role {
      font-size: 10.5px; color: var(--fg-3); font-weight: 400;
      flex-shrink: 0;
    }
    .roster-row-trailing-top {
      grid-column: 3; grid-row: 1;
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .roster-row-meta {
      grid-column: 2 / span 2; grid-row: 2;
      display: flex; align-items: center; gap: 6px;
      min-width: 0;
      font-size: 10.5px; color: var(--fg-2);
    }
    .roster-row-meta .ctx-window-bar { margin-left: 0; }
    .roster-row-meta-spacer { flex: 1; min-width: 4px; }
    .roster-row-tool-slot {
      min-width: 0; overflow: hidden;
      max-width: 50%;
    }
    .roster-row-ago {
      flex-shrink: 0; font-family: var(--font-mono);
      font-size: 10px; color: var(--fg-3);
    }
    .roster-row-cost {
      flex-shrink: 0; font-family: var(--font-mono);
      font-size: 10.5px; color: var(--fg-2);
    }

    /* roster-spotlight: pinned topology block at bottom of rail */
    .rail-topology {
      flex: 0 0 auto;
      border-top: 1px solid var(--line);
      background: var(--bg-1);
    }

    /* roster-spotlight: spotlight empty-state */
    .spotlight-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 32px; color: var(--fg-3); font-size: 12px; text-align: center;
      background: var(--bg-0);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }

    /* Artifact markdown render surface */
    .artifact-md { font-size: 13px; line-height: 1.6; color: var(--fg-0); }
    .artifact-md h1, .artifact-md h2, .artifact-md h3, .artifact-md h4 {
      font-weight: 600; margin: 1.2em 0 0.4em; color: var(--fg-0);
    }
    .artifact-md h1 { font-size: 1.4em; }
    .artifact-md h2 { font-size: 1.2em; }
    .artifact-md h3, .artifact-md h4 { font-size: 1.05em; }
    .artifact-md p { margin: 0.6em 0; }
    .artifact-md ul, .artifact-md ol { padding-left: 1.4em; margin: 0.5em 0; }
    .artifact-md li { margin: 0.2em 0; }
    .artifact-md pre { background: var(--bg-2); border-radius: 4px; padding: 12px 14px; overflow-x: auto; margin: 0.8em 0; }
    .artifact-md code { font-family: var(--font-mono); font-size: 12px; }
    .artifact-md pre code { background: none; padding: 0; }
    .artifact-md :not(pre) > code { background: var(--bg-2); border-radius: 3px; padding: 1px 5px; }
    .artifact-md blockquote { border-left: 3px solid var(--line); margin: 0.6em 0; padding: 2px 0 2px 12px; color: var(--fg-2); }
    .artifact-md a { color: var(--fg-1); text-decoration: underline; }
    .artifact-md hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
    .artifact-md table { border-collapse: collapse; font-size: 12px; }
    .artifact-md th, .artifact-md td { border: 1px solid var(--line); padding: 4px 8px; }
    .artifact-md th { background: var(--bg-2); font-weight: 600; }
    /* Mermaid artifact diagrams: thicken edges so links read clearly on the light drawer.
       (.flowchart-link / .messageLineN are Mermaid v10/v11 SVG edge classes.) */
    .artifact-md svg .flowchart-link { stroke-width: 2.25px; }
    .artifact-md svg .messageLine0, .artifact-md svg .messageLine1 { stroke-width: 1.75px; }
    /* Artifact drawer left-edge resize handle. Straddles the border (left:-3px) so it
       sits over the panel edge rather than covering left-aligned content. */
    .drawer-resize-handle { position: absolute; left: -3px; top: 0; height: 100%; width: 8px; cursor: ew-resize; z-index: 2; }
    .drawer-resize-handle:hover, .drawer-resize-handle.dragging { background: var(--accent-soft); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- marked (md->html) + DOMPurify (html sanitizer) for the artifact viewer.
       SRI integrity hashes are sha384 of the exact pinned unpkg artifacts.
       Recompute on version bump with, e.g.:
         curl -sL https://unpkg.com/marked@4.3.0/marked.min.js \
           | openssl dgst -sha384 -binary | openssl base64 -A
       Correctness is also enforced at test time: if a hash is wrong the script
       fails to load, DOMPurify is undefined, and the dashboard XSS Playwright
       tests (tests/dashboard/test_dashboard_artifact_xss.py) fail. marked is
       pinned to v4 deliberately — v5 changed the API; do not bump blindly. -->
  <script src="https://unpkg.com/marked@4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/dompurify@3.0.11/dist/purify.min.js" integrity="sha384-Ic7KEGROu37YaruU6NyiYeib7UhjFyDZQ5fzBAji965L75T/4LGk5nzwMEjNGexs" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js" integrity="sha384-rbtjAdnIQE/aQJGEgXrVUlMibdfTSa4PQju4HDhN3sR2PmaKFzhEafuePsl9H/9I" crossorigin="anonymous"></script>
  <script>
    // High-contrast default theme for surfaced diagrams: dark edges + dark label
    // text on light-blue nodes, readable on the dark drawer background. securityLevel
    // stays 'strict' (XSS guard). Per-document %%{init}%% blocks still override this.
    mermaid.initialize({
      securityLevel: 'strict',
      theme: 'base',
      startOnLoad: false,
      themeVariables: {
        lineColor: '#0f172a',
        primaryColor: '#cfe2ff',
        primaryTextColor: '#0b1324',
        primaryBorderColor: '#1d4ed8',
        clusterBkg: '#eef2ff',
        clusterBorder: '#4f46e5',
        edgeLabelBackground: '#ffffff',
        actorBkg: '#cfe2ff',
        actorBorder: '#1d4ed8',
        actorTextColor: '#0b1324',
        signalColor: '#0f172a',
        signalTextColor: '#0b1324',
        noteBkgColor: '#fff3bf',
        noteBorderColor: '#b45309',
        noteTextColor: '#0b1324',
        fontSize: '14px',
      },
    });
  </script>
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- WebSocket live state hook ---
    function useLiveState() {
      const [state, setState] = useState(null);
      // F22 D-5: capture performance.now() at message arrival as the monotonic
      // anchor for the elapsed-counter tick. Paired with each instance's
      // server-stamped now_wallclock to compute elapsed seconds independent
      // of NTP corrections and tab-suspend wall-clock jumps.
      const [perfAtArrival, setPerfAtArrival] = useState(0);
      const [connected, setConnected] = useState(false);
      useEffect(() => {
        let ws, timer;
        const connect = () => {
          ws = new WebSocket(`ws://${window.location.host}/ws`);
          ws.onopen = () => setConnected(true);
          ws.onmessage = e => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'state') {
              setState(msg.data);
              setPerfAtArrival(performance.now());
            }
          };
          ws.onclose = () => { setConnected(false); timer = setTimeout(connect, 3000); };
          ws.onerror = () => ws.close();
        };
        connect();
        return () => { clearTimeout(timer); if (ws) ws.close(); };
      }, []);
      return { state, connected, perfAtArrival };
    }

    // --- F22 elapsed-counter helpers ---
    // D-5 enforces: performance.now() (monotonic, NOT Date.now()), and
    // setInterval (NOT requestAnimationFrame) so the counter keeps advancing
    // in backgrounded tabs.
    function useTick1s() {
      const [, setT] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setT(t => (t + 1) % 1000000), 1000);
        return () => clearInterval(id);
      }, []);
    }
    function computeElapsedSeconds(serverNow, perfAtArrival, startedAt) {
      if (serverNow == null || startedAt == null) return null;
      const baseElapsed = serverNow - startedAt;
      const drift = (performance.now() - perfAtArrival) / 1000;
      return Math.max(0, Math.floor(baseElapsed + drift));
    }
    // D-7: settle-frame state. When oldest_in_flight transitions non-null →
    // null, render last_tool_completed for ~500ms before clearing. Cleanup
    // returned from useEffect prevents timer leaks if the column unmounts
    // (tombstone, instance removed) during the 500ms window.
    function useSettleFrame(oldestInFlight, lastToolCompleted) {
      const [settle, setSettle] = useState(null);
      const prevRef = useRef(oldestInFlight);
      useEffect(() => {
        const wasInFlight = prevRef.current != null;
        const nowIdle = oldestInFlight == null;
        prevRef.current = oldestInFlight;
        if (wasInFlight && nowIdle && lastToolCompleted) {
          setSettle(lastToolCompleted);
          const t = setTimeout(() => setSettle(null), 500);
          return () => clearTimeout(t);
        }
      }, [oldestInFlight, lastToolCompleted]);
      return settle;
    }

    // --- Format helpers ---
    function fmtDuration(s) {
      if (s < 60) return `${s}s`;
      if (s < 3600) return `${Math.floor(s / 60)}m`;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return m ? `${h}h ${m}m` : `${h}h`;
    }
    function fmtAgo(iso) {
      const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (s < 5) return "just now";
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      return `${Math.floor(s / 3600)}h ago`;
    }
    function fmtCost(n) { return `$${n.toFixed(3)}`; }
    function fmtTokens(n) {
      if (n < 1000) return String(n);
      if (n < 1_000_000) return `${(n / 1000).toFixed(1)}k`;
      return `${(n / 1_000_000).toFixed(2)}M`;
    }
    function fmtTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }

    // Context-window limit per model family. All Claude models we spawn run
    // on the standard 200k tier — the 1M-context beta is not enabled.
    const CONTEXT_WINDOW_LIMIT = 200_000;
    function ctxBarClass(pct) {
      if (pct >= 0.80) return "ctx-danger";
      if (pct >= 0.50) return "ctx-warn";
      return "ctx-ok";
    }

    // --- ContextWindowBar ---
    // Context-window utilization. The server's resolver emits a canonical
    // agent.ctx_window = {used, limit, pct, source="anthropic"}: `used` is the
    // peak single-LLM invocation input vs the 200k window (the cliff signal —
    // the API bills the SUM across a turn's invocations, but peak-per-invocation
    // is what nears the wall). Falls back to the legacy lastTurn-derived
    // computation if ctx_window is absent.
    function ContextWindowBar({ ctxWindow, lastTurn, totalIn, totalOut }) {
      const cw         = ctxWindow || null;
      const legacyPeak = lastTurn && typeof lastTurn.peak_in === "number" ? lastTurn.peak_in : 0;
      const used       = cw && typeof cw.used  === "number" ? cw.used  : legacyPeak;
      const limit      = cw && typeof cw.limit === "number" && cw.limit > 0 ? cw.limit : CONTEXT_WINDOW_LIMIT;
      const pct        = cw && typeof cw.pct === "number"
        ? cw.pct
        : (limit > 0 ? (used / limit) * 100 : 0);
      const frac       = Math.min(1, pct / 100);
      const cls        = ctxBarClass(frac);
      const widthPct   = pct.toFixed(1) + "%";
      const turnSumIn  = lastTurn && typeof lastTurn.in  === "number" ? lastTurn.in  : 0;
      const turnSumOut = lastTurn && typeof lastTurn.out === "number" ? lastTurn.out : 0;
      const tooltip =
        `peak invocation: ${used.toLocaleString()} in` +
        ` (${pct.toFixed(0)}% of ${fmtTokens(limit)} window)\n` +
        `last turn billed: ${turnSumIn.toLocaleString()} in · ${turnSumOut.toLocaleString()} out` +
        ` (sum across all LLM calls in the turn)\n` +
        `cumulative: ${(totalIn || 0).toLocaleString()} in · ${(totalOut || 0).toLocaleString()} out`;
      return (
        <span className="ctx-window-bar" title={tooltip}>
          <span className="ctx-window-bar-track">
            <span className={`ctx-window-bar-fill ${cls}`} style={{ width: widthPct }}/>
          </span>
          <span>{fmtTokens(used)}/{fmtTokens(limit)}</span>
        </span>
      );
    }

    // --- StatusDot ---
    function StatusDot({ status, size = 6 }) {
      return <span className={`dot ${status}`} style={{ width: size, height: size }}/>;
    }

    // Map a full Claude model id ("claude-opus-4-7") OR a short family
    // name ("opus") to its short family name. Returns the input unchanged
    // when it doesn't match a known family.
    function modelFamily(id) {
      if (!id) return id;
      const s = String(id).toLowerCase();
      if (s.includes("opus")) return "opus";
      if (s.includes("sonnet")) return "sonnet";
      if (s.includes("haiku")) return "haiku";
      return s;
    }

    // --- ModelBadge ---
    // Renders the model family. Prefers `activeModel` (API-authoritative,
    // from AssistantMessage.model) over `model` (the configured/intended
    // value). When falling back to the configured value (no assistant turn
    // observed yet), renders dim/italic so operators can tell intent vs.
    // observed at a glance. Tooltip carries the full ids for inspection.
    function ModelBadge({ model, activeModel }) {
      const observed = !!activeModel;
      const displayId = activeModel || model;
      const fam = modelFamily(displayId);
      const map = {
        "opus":   { hue: 290, label: "opus" },
        "sonnet": { hue: 220, label: "sonnet" },
        "haiku":  { hue: 150, label: "haiku" },
      };
      const m = map[fam] || { hue: 250, label: fam };
      const fg = `oklch(0.42 0.10 ${m.hue})`;
      const bg = `oklch(0.42 0.10 ${m.hue} / 0.10)`;
      const bd = `oklch(0.42 0.10 ${m.hue} / 0.30)`;
      const title = observed
        ? `active model: ${activeModel}`
        : `configured: ${model || "(unknown)"} — no assistant response observed yet`;
      return (
        <span className="mono" title={title} style={{
          display: "inline-flex", alignItems: "center", height: 18,
          padding: "0 6px", borderRadius: 4, fontSize: 10.5,
          color: fg, background: bg, border: `1px solid ${bd}`,
          letterSpacing: "0.02em", textTransform: "lowercase",
          opacity: observed ? 1 : 0.55,
          fontStyle: observed ? "normal" : "italic",
        }}>{m.label}</span>
      );
    }

    // --- AgentAvatar ---
    function AgentAvatar({ id, role, size = 22 }) {
      const hue = (() => {
        let h = 0;
        for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360;
        return h;
      })();
      const initial = role.slice(0, 1).toUpperCase();
      return (
        <span className="mono" style={{
          display: "inline-flex", alignItems: "center", justifyContent: "center",
          width: size, height: size, borderRadius: 4,
          background: `oklch(0.75 0.05 ${hue} / 0.5)`,
          border: `1px solid oklch(0.60 0.07 ${hue} / 0.4)`,
          color: `oklch(0.25 0.06 ${hue})`,
          fontSize: Math.round(size * 0.5), fontWeight: 600, flexShrink: 0,
        }}>{initial}</span>
      );
    }

    // --- Icon ---
    const Icon = {
      folder: (props) => (
        <svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.4" {...props}>
          <path d="M2 4.5a1 1 0 0 1 1-1h2.5l1 1H11a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/>
        </svg>
      ),
    };

    // --- Metric ---
    function Metric({ label, value }) {
      return (
        <div style={{ display: "flex", flexDirection: "column", lineHeight: 1.1 }}>
          <span className="mono" style={{ fontSize: 14, fontWeight: 600 }}>{value}</span>
          <span style={{ fontSize: 10, color: "var(--fg-3)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</span>
        </div>
      );
    }

    // --- StatusPill ---
    function StatusPill({ status, count }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "var(--fg-1)" }}>
          <span className={`dot ${status}`}/>
          <span className="mono" style={{ fontWeight: 600 }}>{count}</span>
          <span style={{ color: "var(--fg-3)" }}>{status === "tool-use" ? "tool" : status}</span>
        </div>
      );
    }

    // --- ConfigChips ---
    function ConfigChips({ config, onClick }) {
      if (!config) return null;
      const chips = [];
      chips.push({ key: 'tools', text: `${(config.tools || []).length} tools` });
      // lead-extends-teammate-tools-and-skills: show "+N extras" chip for lead-extended tools
      const extrasArr = config.extra_tools || [];
      if (extrasArr.length > 0) chips.push({ key: 'extras', text: `+${extrasArr.length} extra${extrasArr.length === 1 ? '' : 's'}`, extra: true });
      const skillsArr = Array.isArray(config.skills) ? config.skills : (config.skills ? [config.skills] : []);
      if (skillsArr.length > 0) chips.push({ key: 'skills', text: `${skillsArr.length} skills` });
      if (config.permission_mode) chips.push({ key: 'perm', text: config.permission_mode });
      const mcpArr = config.mcp_servers || [];
      if (mcpArr.length > 0) chips.push({ key: 'mcp', text: `${mcpArr.length} MCP` });
      if (chips.length === 0) return null;
      return (
        <div className="tm-config-chips" onClick={onClick} title="Click to view full config">
          {chips.map(c => (
            <span key={c.key} className={c.extra ? "tm-config-chip tm-config-chip-extra" : "tm-config-chip"}>{c.text}</span>
          ))}
        </div>
      );
    }

    // --- EffortValue ---
    // Renders the effort row in ConfigDetailPanel. Surfaces the gap between
    // what the operator asked for (spawn-time kwarg) and what the teammate
    // actually ran with (resolved value). Branches, in priority order:
    //   1. Override + diverging pack default → render "<pack> → <resolved>
    //      (requested override)" so the override is unmistakable.
    //   2. Override + no pack default → render "<resolved> (requested override)"
    //      so the operator sees their override didn't have anything to override.
    //   3. No override + pack default matches resolved → "<resolved>
    //      (pack default)" — origin is clear, no divergence to flag.
    //   4. Fallback (override matches pack, or no provenance info on snapshot)
    //      → plain "<resolved>".
    function EffortValue({ resolved, requested, packDefault }) {
      const hasOverride = requested != null;
      const hasPack = packDefault != null;

      if (hasOverride && hasPack && requested !== packDefault) {
        return (
          <div className="tm-detail-value" style={{ display: "flex", alignItems: "baseline", gap: 6, flexWrap: "wrap" }}>
            <span style={{ color: "var(--fg-3)", textDecoration: "line-through" }}>
              {packDefault}
            </span>
            <span style={{ color: "var(--fg-3)" }}>→</span>
            <span>{resolved}</span>
            <span style={{ color: "var(--fg-3)", fontWeight: 400, fontSize: 11 }}>
              (requested override)
            </span>
          </div>
        );
      }
      if (hasOverride && !hasPack) {
        return (
          <div className="tm-detail-value">
            {resolved}
            <span style={{ color: "var(--fg-3)", fontWeight: 400, marginLeft: 6, fontSize: 11 }}>
              (requested override; no pack default)
            </span>
          </div>
        );
      }
      // No override, pack default present. By construction in
      // broker._snapshot_config, resolved == packDefault here — the equality
      // is invariant, not a guard. (Sentinel L-2.)
      if (!hasOverride && hasPack) {
        return (
          <div className="tm-detail-value">
            {resolved}
            <span style={{ color: "var(--fg-3)", fontWeight: 400, marginLeft: 6, fontSize: 11 }}>
              (pack default)
            </span>
          </div>
        );
      }
      // Fallback: override == pack default (nothing to highlight), or
      // snapshot lacks provenance fields entirely (legacy).
      return <div className="tm-detail-value">{resolved}</div>;
    }

    // --- ConfigDetailPanel ---
    function ConfigDetailPanel({ config, agentRole, configuredModel, activeModel, onClose }) {
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [onClose]);

      const skillsArr = Array.isArray(config.skills) ? config.skills : (config.skills ? [config.skills] : []);
      const toolsArr = config.tools || [];
      const dtArr = config.disallowed_tools || [];
      const mcpArr = config.mcp_servers || [];
      // lead-extends-teammate-tools-and-skills: split tools into Pack/Extras when extras present
      const extrasArr = config.extra_tools || [];
      const packToolsArr = extrasArr.length > 0 ? toolsArr.filter(t => !extrasArr.includes(t)) : toolsArr;

      return ReactDOM.createPortal(
        <div className="tm-detail-backdrop" onClick={onClose}>
          <div className="tm-detail-panel" onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
              <span style={{ fontWeight: 600, fontSize: 14 }}>{agentRole} — config</span>
              <button onClick={onClose} style={{
                background: 'none', border: 'none', cursor: 'pointer',
                color: 'var(--fg-3)', fontSize: 16, lineHeight: 1,
              }}>✕</button>
            </div>

            {(config.model || configuredModel || activeModel) && (() => {
              // Render the model chain: pack → override → active. Collapse to a
              // single "active" line when all three resolve to the same family.
              // - pack:     config.model is the AgentDefinition.model (resolved
              //             from pack frontmatter). The "intended default" for
              //             this role.
              // - override: configuredModel (agent.model on /api/state) is the
              //             value passed at spawn (or pack default normalized).
              //             A user-supplied override is detected by family-level
              //             divergence from the pack value.
              // - active:   activeModel is API-authoritative (the model the
              //             Anthropic API actually used on the last response).
              const pack = config.model || null;
              const override = configuredModel || null;
              const active = activeModel || null;
              const packFam = pack ? modelFamily(pack) : null;
              const overrideFam = override ? modelFamily(override) : null;
              const activeFam = active ? modelFamily(active) : null;
              // Detect a "real" override: configured family differs from pack.
              const overrideDiffers =
                override && pack && overrideFam !== packFam;
              // Active diverges when it's observed AND it doesn't match
              // whichever upstream we trust (override > pack).
              const upstreamFam = overrideDiffers ? overrideFam : packFam;
              const activeDiverges = active && upstreamFam && activeFam !== upstreamFam;
              const collapse = !overrideDiffers && !activeDiverges;
              return (
                <div className="tm-detail-section">
                  <div className="tm-detail-label">model</div>
                  {collapse ? (
                    <div className="tm-detail-value">
                      {active || override || pack}
                      {!active && (
                        <span style={{ color: "var(--fg-3)", marginLeft: 6, fontStyle: "italic" }}>
                          (configured; no API response observed yet)
                        </span>
                      )}
                    </div>
                  ) : (
                    <div className="tm-detail-value" style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                      {pack && (
                        <div>
                          <span style={{ color: "var(--fg-3)" }}>pack default: </span>
                          <span>{pack}</span>
                        </div>
                      )}
                      {overrideDiffers && (
                        <div>
                          <span style={{ color: "var(--fg-3)" }}>spawn override: </span>
                          <span>{override}</span>
                        </div>
                      )}
                      <div>
                        <span style={{ color: "var(--fg-3)" }}>active (API): </span>
                        <span>
                          {active || (
                            <em style={{ color: "var(--fg-3)" }}>not observed yet</em>
                          )}
                        </span>
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {(config.permission_mode || config.effort) && (
              <div style={{ display: 'flex', gap: 24 }}>
                {config.permission_mode && (
                  <div className="tm-detail-section">
                    <div className="tm-detail-label">permission mode</div>
                    <div className="tm-detail-value">{config.permission_mode}</div>
                  </div>
                )}
                {config.effort && (
                  <div className="tm-detail-section">
                    <div className="tm-detail-label">effort</div>
                    <EffortValue
                      resolved={config.effort}
                      requested={config.effort_requested}
                      packDefault={config.effort_pack_default}
                    />
                  </div>
                )}
              </div>
            )}

            {toolsArr.length > 0 && extrasArr.length === 0 && (
              <div className="tm-detail-section">
                <div className="tm-detail-label">tools ({toolsArr.length})</div>
                <ul className="tm-detail-list">
                  {toolsArr.map(t => <li key={t} className="tm-detail-list-item">{t}</li>)}
                </ul>
              </div>
            )}
            {toolsArr.length > 0 && extrasArr.length > 0 && (
              <>
                <div className="tm-detail-section">
                  <div className="tm-detail-label">pack ({packToolsArr.length})</div>
                  <ul className="tm-detail-list">
                    {packToolsArr.map(t => <li key={t} className="tm-detail-list-item">{t}</li>)}
                  </ul>
                </div>
                <div className="tm-detail-section">
                  <div className="tm-detail-label">extras (+{extrasArr.length})</div>
                  <ul className="tm-detail-list">
                    {extrasArr.map(t => <li key={t} className="tm-detail-list-item">{t}</li>)}
                  </ul>
                </div>
              </>
            )}

            {dtArr.length > 0 && (
              <div className="tm-detail-section">
                <div className="tm-detail-label">disallowed tools</div>
                <ul className="tm-detail-list">
                  {dtArr.map(t => <li key={t} className="tm-detail-list-item">{t}</li>)}
                </ul>
              </div>
            )}

            {skillsArr.length > 0 && (
              <div className="tm-detail-section">
                <div className="tm-detail-label">skills</div>
                <ul className="tm-detail-list">
                  {skillsArr.map(s => <li key={s} className="tm-detail-list-item">{s}</li>)}
                </ul>
              </div>
            )}

            {mcpArr.length > 0 && (
              <div className="tm-detail-section">
                <div className="tm-detail-label">MCP servers</div>
                <ul className="tm-detail-list">
                  {mcpArr.map(s => <li key={s} className="tm-detail-list-item">{s}</li>)}
                </ul>
              </div>
            )}

            <div className="tm-detail-section">
              <div className="tm-detail-label">system prompt</div>
              {config.system_prompt
                ? <pre className="tm-detail-prompt">{config.system_prompt}</pre>
                : <div className="tm-detail-value" style={{ color: 'var(--fg-3)' }}>(none)</div>
              }
            </div>
          </div>
        </div>,
        document.body,
      );
    }

    // --- Artifact markdown sanitizer ---
    // SECURITY: This is the ONE place dangerouslySetInnerHTML is intentionally
    // used. The pipeline is: marked.parse (Markdown → HTML) → DOMPurify.sanitize
    // (HTML → safe HTML). DOMPurify with this config blocks scripts, inline
    // event handlers, iframe/object/embed/form, style injection, and
    // javascript: URIs. The config is a single constant — do not spread it
    // across files or relax it without a security review.
    //
    // After sanitization a link-hardening pass runs:
    //   - External http(s) links: target=_blank rel=noopener noreferrer
    //   - Relative links: href stripped → inert text (never resolved server-side)
    const _DOMCFG = {
      USE_PROFILES: { html: true },  // html profile is the primary allowlist gate
      FORCE_BODY: true,              // treat input as body fragment; prevents <html>/<head> injection
      FORBID_TAGS: ['style', 'iframe', 'object', 'embed', 'form', 'script'],
      FORBID_ATTR: ['style', 'onerror', 'onload', 'onclick', 'onmouseover',
                    'onfocus', 'onblur', 'onsubmit', 'action'],
    };
    function sanitizeArtifact(md) {
      const rawHtml = marked.parse(md, { gfm: true, breaks: false });
      const clean = DOMPurify.sanitize(rawHtml, _DOMCFG);
      // Link-hardening: parse the sanitized HTML, mutate links, re-serialize.
      // NOTE: `clean` is the ALREADY-SANITIZED DOMPurify output assigned to a
      // detached scratch <div> solely to mutate <a> elements — NOT an
      // unsanitized innerHTML assignment. The render site downstream re-runs
      // sanitizeArtifact's return value through marked/DOMPurify-equivalent JSX,
      // and re-parsing sanitized HTML cannot reintroduce script in a div context.
      const tmp = document.createElement('div');
      tmp.innerHTML = clean;
      tmp.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href') || '';
        if (/^https?:\/\//i.test(href)) {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
        } else {
          // Relative or other scheme: strip href so link is inert text.
          a.removeAttribute('href');
          a.style.cursor = 'default';
          a.style.textDecoration = 'none';
        }
      });
      return tmp.innerHTML;
    }

    // --- Mermaid render pass ---
    // Post-render hook: walks .artifact-md descendants, finds fenced mermaid
    // blocks, renders them as inline SVG, and re-sanitizes the output.
    function renderMermaidBlocks(artifactNode) {
      const codeBlocks = artifactNode.querySelectorAll('pre > code.language-mermaid');
      codeBlocks.forEach(codeEl => {
        const mermaidSource = codeEl.textContent;
        const preEl = codeEl.parentElement;
        if (!preEl) return;

        // Pass raw text to mermaid; securityLevel: 'strict' sanitizes the source.
        // DOMPurify on the source text would corrupt mermaid syntax (e.g. -->
        // becomes --&gt;), so we rely on strict mode + SVG output re-sanitization.
        mermaid.render('mermaid-svg-' + crypto.randomUUID(), mermaidSource)
          .then(({ svg }) => {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = svg;
            const svgEl = wrapper.firstChild;

            // Re-sanitize the SVG output with SVG-specific config.
            // Mermaid (securityLevel:'strict') renders diagram labels as HTML
            // (<p>/<span>/<div>) inside <foreignObject> — NOT as SVG <text>. So we
            // must allow <foreignObject> + those HTML label tags, or every label
            // vanishes (nodes render as black boxes with no text). DOMPurify still
            // sanitises the HTML *inside* the foreignObject, so this is safe:
            // <script>/<a>/<iframe>/<object>/<embed> stay forbidden and all event
            // handlers (onerror/onload/onclick/…) are stripped. Verified on both
            // axes (labels render AND a malicious-mermaid payload is neutralised);
            // the malicious-mermaid XSS test is the regression guard.
            const safeSvg = DOMPurify.sanitize(svgEl.outerHTML, {
              USE_PROFILES: { svg: true, svgFilters: true },
              ADD_TAGS: ['foreignObject', 'div', 'span', 'p', 'br', 'style'],
              ADD_ATTR: ['style', 'class', 'xmlns'],
              FORBID_TAGS: ['script', 'image', 'a', 'iframe', 'object', 'embed'],
              FORBID_ATTR: ['onerror', 'onload', 'onclick', 'onmouseover',
                             'onfocus', 'onblur'],
            });

            // Parse the sanitized SVG leniently as HTML — NOT strict XML.
            // DOMParser('image/svg+xml') is strict XML and chokes on HTML void
            // elements (<br>, <img>) that mermaid emits inside foreignObject labels
            // (e.g. a multi-line label written with <br/>), erroring the whole
            // render. safeSvg is already DOMPurify-sanitized, so innerHTML is safe.
            const holder = document.createElement('div');
            holder.innerHTML = safeSvg;
            const cleanSvg = holder.querySelector('svg');
            if (cleanSvg) preEl.replaceWith(cleanSvg);
          })
          .catch(() => {
            // On render failure, leave the original <pre> block in place.
          });
      });
    }

    // --- OverlayPanel primitive ---
    // Portal-based overlay. mode="modal" = centered panel; mode="drawer" = right-side
    // slide-in. Handles Esc, backdrop click-outside, X button, and focus management.
    function OverlayPanel({ mode, size, onClose, children }) {
      const panelRef = useRef(null);

      // Drawer-only: drag the left edge to resize. Persisted across reloads.
      const clampWidth = (w) => Math.min(Math.max(w, 360), Math.round(window.innerWidth * 0.95));
      const [drawerWidth, setDrawerWidth] = useState(() => {
        const saved = parseInt(localStorage.getItem('artifactDrawerWidth') || '', 10);
        // Re-clamp on hydration: a width saved on a larger viewport must not overflow this one.
        return Number.isFinite(saved) ? clampWidth(saved) : null;
      });
      const [resizing, setResizing] = useState(false);
      const draggingRef = useRef(false);

      const startResize = (e) => {
        e.preventDefault();
        if (draggingRef.current) return;  // guard: ignore overlapping drags (double mousedown)
        draggingRef.current = true;
        setResizing(true);
        const prevUserSelect = document.body.style.userSelect;
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'ew-resize';
        const onMove = (ev) => {
          // Right-anchored drawer: width grows as the cursor moves left.
          setDrawerWidth(clampWidth(window.innerWidth - ev.clientX));
        };
        const onUp = () => {
          draggingRef.current = false;
          setResizing(false);
          document.body.style.userSelect = prevUserSelect;
          document.body.style.cursor = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          setDrawerWidth((w) => { if (w) localStorage.setItem('artifactDrawerWidth', String(w)); return w; });
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };

      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', handler);
        // Trap focus: move focus into panel on open.
        if (panelRef.current) panelRef.current.focus();
        return () => document.removeEventListener('keydown', handler);
      }, [onClose]);

      const backdropStyle = {
        position: 'fixed', inset: 0,
        background: 'rgba(0,0,0,0.45)',
        zIndex: 1000,
        display: 'flex',
        alignItems: mode === 'modal' ? 'center' : 'stretch',
        justifyContent: mode === 'modal' ? 'center' : 'flex-end',
      };

      const panelStyle = mode === 'drawer' ? {
        position: 'relative',
        width: drawerWidth ? drawerWidth + 'px' : (size || 'min(720px, 55vw)'),
        height: '100vh',
        background: 'var(--bg-1)',
        borderLeft: '1px solid var(--line)',
        display: 'flex', flexDirection: 'column',
        transform: 'translateX(0)',
        // Animate only the slide-in transform, never width (avoids a snap when a drag ends).
        transition: resizing ? 'none' : 'transform 180ms ease-out, width 0ms',
        outline: 'none',
        overflow: 'hidden',
      } : {
        width: size || 640,
        maxHeight: '85vh',
        background: 'var(--bg-1)',
        borderRadius: 8,
        border: '1px solid var(--line)',
        display: 'flex', flexDirection: 'column',
        outline: 'none',
        overflow: 'hidden',
      };

      return ReactDOM.createPortal(
        <div style={backdropStyle} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div ref={panelRef} tabIndex={-1} style={panelStyle} onClick={e => e.stopPropagation()}>
            {mode === 'drawer' && (
              <div
                className={'drawer-resize-handle' + (resizing ? ' dragging' : '')}
                onMouseDown={startResize}
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize artifact panel"
                title="Drag to resize"
              />
            )}
            {children}
          </div>
        </div>,
        document.body
      );
    }

    // --- ArtifactTray (dropdown) ---
    function ArtifactTray({ artifacts, onOpen, onMarkRead, onClose }) {
      const ref = useRef(null);
      useEffect(() => {
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [onClose]);

      return (
        <div ref={ref} style={{
          position: 'absolute', top: '100%', right: 0, marginTop: 6,
          width: 380, background: 'var(--bg-1)',
          border: '1px solid var(--line)', borderRadius: 6,
          boxShadow: '0 4px 16px rgba(0,0,0,0.3)',
          zIndex: 900, overflow: 'hidden',
        }}>
          {artifacts.length === 0 ? (
            <div style={{ padding: '14px 16px', color: 'var(--fg-3)', fontSize: 12 }}>
              No artifacts surfaced yet.
            </div>
          ) : (
            <div style={{ maxHeight: 320, overflowY: 'auto' }}>
              {artifacts.map((a, idx) => {
                const unread = !a._read;
                const ts = a.timestamp_utc
                  ? new Date(a.timestamp_utc * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                  : '';
                return (
                  <div key={a.artifact_id}
                    className="artifact-tray-item"
                    onClick={() => { onOpen(a.artifact_id); }}
                    style={{
                      padding: '10px 16px', cursor: 'pointer',
                      borderBottom: idx < artifacts.length - 1 ? '1px solid var(--line)' : 'none',
                      background: unread ? 'var(--bg-2)' : 'transparent',
                      display: 'flex', alignItems: 'center', gap: 8,
                    }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-2)'}
                    onMouseLeave={e => e.currentTarget.style.background = unread ? 'var(--bg-2)' : 'transparent'}
                  >
                    {unread && <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--accent)', flexShrink: 0 }}/>}
                    {!unread && <span style={{ width: 6, flexShrink: 0 }}/>}
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: unread ? 600 : 400, fontSize: 12, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {a.title}
                      </div>
                      <div style={{ fontSize: 11, color: 'var(--fg-3)', marginTop: 2 }}>
                        {a.surfacing_teammate} · {ts}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // --- ArtifactDrawer ---
    function ArtifactDrawer({ crewId, artifactId, allArtifacts, onNavigate, onClose }) {
      const [fetchStatus, setFetchStatus] = useState('loading'); // loading|ok|not_found|error
      const [rec, setRec] = useState(null);
      const [copied, setCopied] = useState(false);

      const idx = allArtifacts.findIndex(a => a.artifact_id === artifactId);
      const total = allArtifacts.length;
      // Chronological order: allArtifacts is newest-first from state; reverse for prev/next
      const chrono = [...allArtifacts].reverse();
      const chronoIdx = chrono.findIndex(a => a.artifact_id === artifactId);

      useEffect(() => {
        setFetchStatus('loading');
        setRec(null);
        fetch(`/artifact/${encodeURIComponent(crewId)}/${encodeURIComponent(artifactId)}`)
          .then(r => {
            if (r.status === 404) { setFetchStatus('not_found'); return null; }
            if (!r.ok) { setFetchStatus('error'); return null; }
            return r.json();
          })
          .then(data => {
            if (data === null) return;
            setRec(data);
            setFetchStatus('ok');
          })
          .catch(() => setFetchStatus('error'));
      }, [crewId, artifactId]);

      const handleCopy = () => {
        const text = rec ? rec.body : '';
        const doFallback = () => {
          try {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            setCopied(true);
            setTimeout(() => setCopied(false), 1500);
          } catch (_) {}
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 1500);
          }).catch(doFallback);
        } else { doFallback(); }
      };

      const hasPrev = chronoIdx > 0;
      const hasNext = chronoIdx < chrono.length - 1;
      const goPrev = () => hasPrev && onNavigate(chrono[chronoIdx - 1].artifact_id);
      const goNext = () => hasNext && onNavigate(chrono[chronoIdx + 1].artifact_id);

      const ts = rec
        ? new Date(rec.timestamp_utc * 1000).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
        : '';
      const sizeKb = rec ? (new TextEncoder().encode(rec.body).length / 1024).toFixed(1) : '';

      return (
        <OverlayPanel mode="drawer" onClose={onClose}>
          {/* sticky header */}
          <div style={{ padding: '14px 18px 10px', borderBottom: '1px solid var(--line)', flexShrink: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <button onClick={goPrev} disabled={!hasPrev} style={{ background: 'none', border: 'none', cursor: hasPrev ? 'pointer' : 'default', color: hasPrev ? 'var(--fg-1)' : 'var(--fg-3)', fontSize: 16, padding: '2px 4px' }}>‹</button>
              <span style={{ fontSize: 11, color: 'var(--fg-3)' }}>{chronoIdx + 1} of {chrono.length}</span>
              <button onClick={goNext} disabled={!hasNext} style={{ background: 'none', border: 'none', cursor: hasNext ? 'pointer' : 'default', color: hasNext ? 'var(--fg-1)' : 'var(--fg-3)', fontSize: 16, padding: '2px 4px' }}>›</button>
              <button onClick={onClose} style={{ marginLeft: 'auto', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg-3)', fontSize: 18, lineHeight: 1, padding: '2px 4px' }}>✕</button>
            </div>
            {fetchStatus === 'ok' && rec && (
              <>
                <div style={{ fontWeight: 600, fontSize: 14, marginTop: 8, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{rec.title}</div>
                <div className="mono" style={{ fontSize: 10.5, color: 'var(--fg-3)', marginTop: 3 }}>
                  {rec.surfacing_teammate} · {ts} · {sizeKb} KB
                </div>
                <div className="mono" style={{ fontSize: 10, color: 'var(--fg-3)', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{rec.path_label}</div>
              </>
            )}
          </div>

          {/* scrolling body */}
          <div style={{ flex: 1, overflowY: 'auto', padding: '18px 22px' }}>
            {fetchStatus === 'loading' && <div style={{ color: 'var(--fg-3)', fontSize: 12 }}>Loading…</div>}
            {fetchStatus === 'not_found' && <div style={{ color: 'var(--fg-3)', fontSize: 12, fontStyle: 'italic' }}>Artifact no longer available (evicted).</div>}
            {fetchStatus === 'error' && <div style={{ color: 'var(--st-error)', fontSize: 12 }}>Failed to load artifact.</div>}
            {/* SECURITY: artifact body is rendered via dangerouslySetInnerHTML ONLY because
                it has been processed through the full sanitizeArtifact() pipeline:
                  marked.parse (Markdown → HTML) → DOMPurify.sanitize (_DOMCFG) → link-hardening.
                This is the single approved site for dangerouslySetInnerHTML in the dashboard.
                Do not add additional dangerouslySetInnerHTML calls elsewhere. */}
            {fetchStatus === 'ok' && rec && (
              <div
                className="artifact-md"
                dangerouslySetInnerHTML={{ __html: sanitizeArtifact(rec.body) }}
                ref={(el) => { if (el) renderMermaidBlocks(el); }}
              />
            )}
          </div>

          {/* sticky footer */}
          <div style={{ padding: '10px 18px', borderTop: '1px solid var(--line)', flexShrink: 0, display: 'flex', alignItems: 'center' }}>
            <button onClick={handleCopy} style={{
              background: 'var(--bg-2)', border: '1px solid var(--line)', borderRadius: 4,
              color: 'var(--fg-1)', cursor: 'pointer', fontSize: 11, padding: '5px 12px',
            }}>
              {copied ? 'Copied!' : 'Copy raw'}
            </button>
          </div>
        </OverlayPanel>
      );
    }

    // --- MCTopBar ---
    function MCTopBar({ instances, connected, activeArtifacts, unreadCount, onOpenArtifactTray, artifactTrayContent }) {
      const totals = instances.reduce((acc, i) => {
        const live = i.agents.filter(a => a.dead !== true);
        acc.agents += live.length;
        acc.cost += i.cost;
        acc.in += i.tokens.in;
        acc.out += i.tokens.out;
        acc.byStatus.thinking += live.filter(a => a.status === "thinking").length;
        acc.byStatus.tool += live.filter(a => a.status === "tool-use").length;
        acc.byStatus.idle += live.filter(a => a.status === "idle").length;
        acc.byStatus.waiting += live.filter(a => a.status === "waiting").length;
        return acc;
      }, { agents: 0, cost: 0, in: 0, out: 0, byStatus: { thinking: 0, tool: 0, idle: 0, waiting: 0 } });

      const connDot = {
        width: 6, height: 6, borderRadius: "50%", flexShrink: 0,
        background: connected ? "var(--st-done)" : "var(--st-thinking)",
        display: "inline-block",
        title: connected ? "Connected" : "Reconnecting…",
      };

      return (
        <div style={{
          height: 56, padding: "0 22px",
          display: "flex", alignItems: "center", gap: 18,
          borderBottom: "1px solid var(--line)",
          background: "var(--bg-0)",
          flexShrink: 0,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <svg width="14" height="14" viewBox="0 0 14 14">
              <circle cx="7" cy="7" r="2" fill="oklch(0.50 0.14 220)"/>
              <circle cx="7" cy="7" r="5" fill="none" stroke="oklch(0.50 0.14 220 / 0.4)"/>
            </svg>
            <span style={{ fontWeight: 600, fontSize: 13 }}>claude-crew</span>
            <span className="chip">mission control</span>
            <span
              style={connDot}
              title={connected ? "Connected" : "Reconnecting…"}
            />
          </div>

          <div style={{ marginLeft: "auto", display: "flex", gap: 22, alignItems: "center" }}>
            <Metric label="instances" value={instances.length}/>
            <Metric label="agents" value={totals.agents}/>
            <Metric label="cost" value={`$${totals.cost.toFixed(2)}`}/>
            <Metric label="tokens" value={fmtTokens(totals.in + totals.out)}/>
            <div style={{ width: 1, height: 24, background: "var(--line)" }}/>
            <StatusPill status="thinking" count={totals.byStatus.thinking}/>
            <StatusPill status="tool-use" count={totals.byStatus.tool}/>
            <StatusPill status="waiting" count={totals.byStatus.waiting}/>
            <StatusPill status="idle" count={totals.byStatus.idle}/>
            {/* Artifacts pill — scoped to active instance */}
            <div style={{ position: "relative" }}>
              <button
                data-testid="artifacts-pill"
                onClick={onOpenArtifactTray}
                style={{
                  display: "flex", alignItems: "center", gap: 5,
                  background: "var(--bg-2)", border: "1px solid var(--line)",
                  borderRadius: 4, padding: "3px 9px", cursor: "pointer",
                  color: "var(--fg-1)", fontSize: 11, fontFamily: "var(--font-sans)",
                }}
              >
                <span>📄</span>
                <span>Artifacts</span>
                {unreadCount > 0 && (
                  <span style={{
                    background: "var(--accent)", color: "#fff",
                    borderRadius: 10, padding: "0 5px", fontSize: 10, fontWeight: 700,
                    minWidth: 16, textAlign: "center",
                  }}>{unreadCount}</span>
                )}
              </button>
              {artifactTrayContent}
            </div>
          </div>
        </div>
      );
    }

    // --- InstanceStrip ---
    function InstanceStrip({ instances, activeId, onSelect, readState }) {
      return (
        <div style={{
          display: "flex", gap: 10, padding: "12px 22px",
          borderBottom: "1px solid var(--line)", background: "var(--bg-0)",
          overflowX: "auto", flexShrink: 0,
        }}>
          {instances.map(cli => {
            const active = cli.id === activeId;
            const unreachable = cli.status === "unreachable";
            const liveAgentsLocal = cli.agents.filter(a => a.dead !== true);
            const statuses = liveAgentsLocal.map(a => a.status);
            const borderColor = unreachable ? "oklch(0.60 0.15 25 / 0.30)" : active ? "var(--accent-line)" : "var(--line)";
            // Unread dot: show on inactive instances that have unread artifacts
            const artifacts = cli.artifacts || [];
            const hasUnread = !active && artifacts.some(a => !(readState && readState[a.artifact_id]));
            return (
              <div key={cli.id} onClick={() => onSelect(cli.id)} style={{
                flex: "1 0 280px", minWidth: 280,
                padding: "12px 14px", cursor: "pointer",
                borderRadius: 6,
                background: active ? "var(--bg-2)" : "var(--bg-1)",
                border: `1px solid ${borderColor}`,
                opacity: unreachable ? 0.6 : 1,
                position: "relative",
              }}>
                {active && !unreachable && <div style={{ position: "absolute", left: -1, top: 8, bottom: 8, width: 2, background: "var(--accent)", borderRadius: 999 }}/>}
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <StatusDot status={unreachable ? "unreachable" : "active"}/>
                  <span style={{ fontSize: 13, fontWeight: 600 }}>{cli.label}</span>
                  {cli.is_local && (
                    <span style={{
                      display: "inline-flex", alignItems: "center", height: 16, padding: "0 6px",
                      borderRadius: 3, fontSize: 9.5, fontWeight: 600, letterSpacing: "0.05em",
                      textTransform: "uppercase", color: "var(--accent)",
                      background: "var(--accent-soft)", border: "1px solid var(--accent-line)",
                    }}>local</span>
                  )}
                  {/* Unread artifact dot on inactive instances */}
                  {hasUnread && (
                    <span data-testid="instance-unread-dot" style={{ width: 7, height: 7, borderRadius: "50%", background: "var(--accent)", display: "inline-block", flexShrink: 0 }}/>
                  )}
                  <span className="mono" style={{ fontSize: 10.5, color: "var(--fg-3)", marginLeft: "auto" }}>{cli.id}</span>
                </div>
                <div style={{ fontSize: 11, color: "var(--fg-2)", marginTop: 3, display: "flex", alignItems: "center", gap: 6 }} className="mono">
                  {unreachable ? (
                    <span style={{ color: "var(--st-error)", opacity: 0.8 }}>unreachable</span>
                  ) : (
                    <><Icon.folder/>{cli.cwd}</>
                  )}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 4, marginTop: 9 }}>
                  {unreachable
                    ? <span style={{ fontSize: 11, color: "var(--fg-3)" }}>—</span>
                    : statuses.map((s, i) => <span key={i} className={`dot ${s}`}/>)
                  }
                  <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--fg-2)" }}>
                    <span className="mono" style={{ color: unreachable ? "var(--fg-3)" : "var(--fg-0)" }}>{liveAgentsLocal.length}</span>
                    {" "}agents · <span className="mono" style={{ color: unreachable ? "var(--fg-3)" : "var(--fg-0)" }}>{fmtCost(cli.cost)}</span>
                  </span>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // --- MiniGraph ---
    function MiniGraph({ cli, agents }) {
      const W = 290, H = 320;
      const center = { x: W / 2, y: H / 2 - 10 };
      const r = 95;
      const positions = agents.map((a, i) => {
        const t = (i / agents.length) * Math.PI * 2 - Math.PI / 2;
        return { ...a, x: center.x + Math.cos(t) * r, y: center.y + Math.sin(t) * r };
      });

      return (
        <div style={{ borderRight: "1px solid var(--line)", padding: "16px 18px", display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ fontSize: 10.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em", color: "var(--fg-2)", marginBottom: 4 }}>
            Topology
          </div>
          <div style={{ fontSize: 12, color: "var(--fg-2)", marginBottom: 8 }}>{cli.label}</div>
          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 320 }}>
            <defs>
              <radialGradient id="mcCenter" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor="oklch(0.50 0.14 220 / 0.20)"/>
                <stop offset="100%" stopColor="oklch(0.50 0.14 220 / 0)"/>
              </radialGradient>
            </defs>
            {positions.map(p => (
              <line key={`e-${p.id}`} x1={center.x} y1={center.y} x2={p.x} y2={p.y}
                stroke="oklch(0.75 0.01 250)" strokeWidth="1"/>
            ))}
            <circle cx={center.x} cy={center.y} r="40" fill="url(#mcCenter)"/>
            <circle cx={center.x} cy={center.y} r="22" fill="var(--bg-2)" stroke="var(--accent-line)"/>
            <text x={center.x} y={center.y + 4} textAnchor="middle" fontSize="10" fontFamily="var(--font-mono)" fill="var(--fg-0)">lead</text>
            {positions.map(p => (
              <g key={p.id} transform={`translate(${p.x} ${p.y})`}>
                <circle r="14" fill="var(--bg-2)" stroke="var(--line)"/>
                <circle r="4" fill={
                  p.status === "thinking" ? "var(--st-thinking)" :
                  p.status === "tool-use" ? "var(--st-tool)" :
                  p.status === "waiting"  ? "var(--st-waiting)" :
                  "var(--st-idle)"
                }>
                  {(p.status === "thinking" || p.status === "tool-use") &&
                    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
                  }
                </circle>
                <text y="26" textAnchor="middle" fontSize="9" fontFamily="var(--font-mono)" fill="var(--fg-2)">{p.id.slice(0, 8)}</text>
              </g>
            ))}
            {positions.filter(p => p.status === "thinking" || p.status === "tool-use").map((p, i) => (
              <circle key={`pulse-${p.id}`} r="2" fill="var(--accent)">
                <animateMotion dur={`${2.4 + i * 0.3}s`} repeatCount="indefinite"
                  path={`M ${p.x} ${p.y} L ${center.x} ${center.y}`}/>
                <animate attributeName="opacity" values="0;1;0" dur={`${2.4 + i * 0.3}s`} repeatCount="indefinite"/>
              </circle>
            ))}
          </svg>

          <div style={{ marginTop: "auto", display: "flex", flexDirection: "column", gap: 4, fontSize: 11, color: "var(--fg-2)" }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span>cwd</span><span className="mono" style={{ color: "var(--fg-0)" }}>{cli.cwd}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span>branch</span><span className="mono" style={{ color: "var(--accent)" }}>{cli.branch}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span>uptime</span><span className="mono" style={{ color: "var(--fg-0)" }}>{fmtDuration(cli.uptime)}</span>
            </div>
          </div>
        </div>
      );
    }

    // Render a stored tool-output body nicely. The body is the raw SDK tool
    // response (often a JSON envelope). Parse it and surface the useful text;
    // fall back to the raw string for non-JSON or truncated-unparseable bodies.
    // Returns { header, text } — header is an optional label (e.g. file path).
    function formatToolBody(raw) {
      let parsed;
      try { parsed = JSON.parse(raw); }
      catch (_) { return { header: null, text: raw }; }  // non-JSON / truncated
      if (parsed && typeof parsed === "object") {
        // Read: {type:"text", file:{filePath, content}}
        if (parsed.file && typeof parsed.file.content === "string") {
          // Type-guard filePath: it's attacker-influenced; a non-string would
          // render as "[object Object]".
          const fp = typeof parsed.file.filePath === "string" ? parsed.file.filePath : null;
          return { header: fp, text: parsed.file.content };
        }
        // Bash/shell: {stdout, stderr, ...}
        if (typeof parsed.stdout === "string" || typeof parsed.stderr === "string") {
          let t = parsed.stdout || "";
          if (parsed.stderr) t += (t ? "\n" : "") + "[stderr]\n" + parsed.stderr;
          return { header: null, text: t || "(no output)" };
        }
        // Any other JSON: pretty-print.
        try { return { header: null, text: JSON.stringify(parsed, null, 2) }; }
        catch (_) { return { header: null, text: raw }; }
      }
      // JSON primitive (string/number/bool/null) → show as-is.
      return { header: null, text: String(parsed) };
    }

    // --- ToolOutputModal ---
    function ToolOutputModal({ crewId, fromId, toolUseId, onClose }) {
      const [fetchStatus, setFetchStatus] = useState("loading"); // "loading"|"ok"|"not_found"|"error"
      const [body, setBody] = useState("");
      const [copied, setCopied] = useState(false);
      const formatted = formatToolBody(body);

      useEffect(() => {
        setFetchStatus("loading");
        setBody("");
        fetch(`/tool-output/${encodeURIComponent(crewId)}/${encodeURIComponent(fromId)}/${encodeURIComponent(toolUseId)}`)
          .then(r => {
            if (r.status === 404) { setFetchStatus("not_found"); return null; }
            if (!r.ok) { setFetchStatus("error"); return null; }
            return r.json();
          })
          .then(data => {
            if (data === null) return;
            setBody(data.body || "");
            setFetchStatus("ok");
          })
          .catch(() => setFetchStatus("error"));
      }, [crewId, fromId, toolUseId]);

      const handleCopy = () => {
        const doFallback = () => {
          try {
            const el = document.createElement("textarea");
            el.value = formatted.text;
            document.body.appendChild(el);
            el.select();
            document.execCommand("copy");
            document.body.removeChild(el);
            setCopied(true);
            setTimeout(() => setCopied(false), 1500);
          } catch (_) {}
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(formatted.text).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 1500);
          }).catch(doFallback);
        } else {
          doFallback();
        }
      };

      return (
        <OverlayPanel mode="modal" onClose={onClose}>
          <div className="tm-detail-panel">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
              <span style={{ fontWeight: 600, fontSize: 14 }}>Tool Output</span>
              <button onClick={onClose} style={{
                background: 'none', border: 'none', cursor: 'pointer',
                color: 'var(--fg-3)', fontSize: 16, lineHeight: 1,
              }}>✕</button>
            </div>
            <div className="mono" style={{ fontSize: 10.5, color: 'var(--fg-3)', marginBottom: 6 }}>
              {fromId} · {toolUseId}
            </div>
            {fetchStatus === "loading" && (
              <div style={{ color: 'var(--fg-3)', fontSize: 12 }}>Loading…</div>
            )}
            {fetchStatus === "not_found" && (
              <div style={{ color: 'var(--fg-3)', fontSize: 12, fontStyle: 'italic' }}>
                Output no longer available (evicted from rolling buffer)
              </div>
            )}
            {fetchStatus === "error" && (
              <div style={{ color: 'var(--st-error)', fontSize: 12 }}>
                Failed to load tool output.
              </div>
            )}
            {/* SECURITY: tool output is attacker-influenced (redaction masks
                secrets, not markup). formatted.header/.text are rendered as JSX
                children only (React auto-escapes) — never via dangerouslySetInnerHTML,
                and never as an href/src derived from filePath. Keep it that way. */}
            {fetchStatus === "ok" && (
              <>
                {formatted.header && (
                  <div className="mono" style={{ fontSize: 11, color: 'var(--fg-2)', marginBottom: 4, wordBreak: 'break-all' }}>
                    {formatted.header}
                  </div>
                )}
                <pre className="tm-detail-prompt">{formatted.text}</pre>
                <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 6 }}>
                  <button onClick={handleCopy} style={{
                    background: 'var(--bg-2)', border: '1px solid var(--line)',
                    borderRadius: 4, padding: '4px 14px',
                    cursor: 'pointer', fontSize: 12, color: 'var(--fg-1)',
                    fontFamily: 'var(--font-sans)',
                  }}>
                    {copied ? "Copied!" : "Copy"}
                  </button>
                </div>
              </>
            )}
          </div>
        </OverlayPanel>
      );
    }

    // --- MiniMessage ---
    function MiniMessage({ msg, agentMap, onOpenToolModal }) {
      const isTool = msg.kind === "tool";
      const isThinking = msg.kind === "thinking";
